<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Дешевые железнодорожные билеты</title>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<header class="site-header">
    <div class="header-container">
        <div class="logo-container">
            <a href="/" class="logo-link">
                <span class="logo-text">ЖДР</span>
            </a>
        </div>

        <nav class="main-nav">
            <ul class="nav-list">
                <li class="nav-item"><a href="/tickets" class="nav-link">Билеты</a></li>
                <li class="nav-item"><a href="/schedule" class="nav-link">Расписание</a></li>
                <li class="nav-item"><a href="/stations" class="nav-link">Станции</a></li>
                <li class="nav-item"><a href="/info" class="nav-link">Информация</a></li>
            </ul>
        </nav>

        <div class="user-actions">
            <!-- Для неавторизованных -->
            <div sec:authorize="!isAuthenticated()">
                <a href="/login" class="auth-button">Войти</a>
                <a href="/register" class="auth-button register-button">Регистрация</a>
            </div>

            <!-- Для авторизованных -->
            <div sec:authorize="isAuthenticated()">
                <a href="/profile" class="auth-button">
                    <span sec:authentication="name"></span>
                </a>
                <form th:action="@{/logout}" method="post" style="display: inline-block;">
                    <button type="submit" class="auth-button logout-button">Выйти</button>
                </form>
            </div>
        </div>
    </div>
</header>

<main>
    <div class="search-widget">
        <div class="search-fields">
            <div class="direction-input">
                <input type="text" id="from-station" placeholder="Откуда" autocomplete="off">
                <div class="suggestions" id="from-suggestions"></div>
            </div>

            <button class="swap-button" id="swap-stations">
                <svg width="24" height="24" viewBox="0 0 24 24">
                    <path d="M6 8.755h9.467l-2.4 2.327.933.905 4-3.878-4-3.88-.933.906 2.4 2.327H6zM18 15.245H8.533l2.4-2.327-.933-.905-4 3.878 4 3.88.933-.906-2.4-2.327H18z"/>
                </svg>
            </button>

            <div class="direction-input">
                <input type="text" id="to-station" placeholder="Куда" autocomplete="off">
                <div class="suggestions" id="to-suggestions"></div>
            </div>
        </div>

        <div class="date-widget">
            <div class="date-buttons">
                <button type="button" class="date-button" id="departure-btn">
                    <span class="label">Туда</span>
                    <span class="selected-date" id="departure-date-display"></span>
                </button>

                <button type="button" class="date-button" id="return-btn" disabled>
                    <span class="label">Обратно</span>
                    <span class="selected-date" id="return-date-display"></span>
                </button>
            </div>

            <input type="date" id="departure-date" required>
            <input type="date" id="return-date">
        </div>

        <button class="search-button" id="search-button">Найти билеты</button>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('swap-stations').addEventListener('click', function() {
            const from = document.getElementById('from-station');
            const to = document.getElementById('to-station');
            [from.value, to.value] = [to.value, from.value];
        });

        const setupAutocomplete = (inputId, suggestionsId) => {
            const input = document.getElementById(inputId);
            const suggestions = document.getElementById(suggestionsId);

            input.addEventListener('input', async function(e) {
                if (e.target.value.length < 2) {
                    suggestions.style.display = 'none';
                    return;
                }

                try {
                    const response = await fetch(`/api/stations?query=${encodeURIComponent(e.target.value)}`);
                    const stations = await response.json();

                    suggestions.innerHTML = stations.map(station =>
                        `<div class="suggestion-item">${station.name} (${station.city})</div>`
                    ).join('');

                    suggestions.style.display = stations.length ? 'block' : 'none';
                } catch (error) {
                    console.error('Ошибка получения станций:', error);
                }
            });

            suggestions.addEventListener('click', function(e) {
                if (e.target.classList.contains('suggestion-item')) {
                    input.value = e.target.textContent;
                    suggestions.style.display = 'none';
                }
            });
        };

        setupAutocomplete('from-station', 'from-suggestions');
        setupAutocomplete('to-station', 'to-suggestions');

        document.getElementById('search-button').addEventListener('click', function() {
            // Получаем значения полей
            const fromStation = document.getElementById('from-station').value;
            const toStation = document.getElementById('to-station').value;
            const departureDate = document.getElementById('departure-date').value;

            // Проверяем, что все поля заполнены
            if (!fromStation || !toStation || !departureDate) {
                alert('Пожалуйста, заполните все поля: Откуда, Куда и Дата');
                return;
            }

            // Формируем URL с параметрами
            const params = new URLSearchParams();
            params.append('from', fromStation);
            params.append('to', toStation);
            params.append('date', departureDate);

            // Перенаправляем на страницу результатов
            window.location.href = '/results?' + params.toString();
        });

        const departureBtn = document.getElementById('departure-btn');
        const returnBtn = document.getElementById('return-btn');
        const departureInput = document.getElementById('departure-date');
        const returnInput = document.getElementById('return-date');
        const departureDisplay = document.getElementById('departure-date-display');
        const returnDisplay = document.getElementById('return-date-display');

        departureBtn.addEventListener('click', () => departureInput.showPicker());
        returnBtn.addEventListener('click', () => returnInput.showPicker());

        departureInput.addEventListener('change', function() {
            const date = new Date(this.value);
            departureDisplay.textContent = date.toLocaleDateString('ru-RU');
            returnBtn.disabled = false;
            returnInput.min = this.value;

            if(returnInput.value && new Date(returnInput.value) < date) {
                returnInput.value = '';
                returnDisplay.textContent = '';
            }
        });

        returnInput.addEventListener('change', function() {
            returnDisplay.textContent = this.value
                ? new Date(this.value).toLocaleDateString('ru-RU')
                : '';
        });
    });
</script>
</body>
</html>
